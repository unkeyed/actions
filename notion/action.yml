name: Sync Markdown to Notion
description: Synchronize marked Markdown and MDX files into Notion wikis.
author: Unkey

inputs:
  config:
    description: Repository-relative path to the Notion root registry.
    required: false
    default: .github/notion.yaml

runs:
  using: node24
  main: dist/index.cjs

branding:
  icon: upload-cloud
  color: blue
