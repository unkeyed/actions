name: Sync Markdown to Notion
description: Synchronize marked Markdown and MDX files into Notion wikis.
author: Unkey

inputs:
  root-page-id:
    description: ID of the Notion wiki managed by this action invocation.
    required: true
  repository-base-path:
    description: Repository path represented by the Notion wiki root.
    required: false
    default: .

runs:
  using: node24
  main: dist/index.cjs

branding:
  icon: upload-cloud
  color: blue
