name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  notion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: notion/go.mod
          cache-dependency-path: notion/go.sum
      - name: Test
        working-directory: notion
        run: go test ./...
      - name: Build action image
        working-directory: notion
        run: docker build .
